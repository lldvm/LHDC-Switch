{%- include lang_vars.html -%}
<div class="lang-menu">
  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
  <select id="lang-select" aria-label="Language">
    {%- for l in site.languages %}
    <option lang="{{ l.code }}" value="{% include lang_url.html code=l.code %}"{% if l.code == lang_current %} selected{% endif %}>{{ l.name }}</option>
    {%- endfor %}
  </select>
</div>
<script>
(function () {
  var sel = document.getElementById('lang-select');
  /* Keep the section the reader is on: translations share heading anchors.
     (Block comments only: the theme joins the page into one line.) */
  sel.addEventListener('change', function () { location.href = sel.value + location.hash; });
  /* Back/forward cache would otherwise show the language that was picked last. */
  window.addEventListener('pageshow', function () {
    for (var i = 0; i < sel.options.length; i++) if (sel.options[i].defaultSelected) sel.selectedIndex = i;
  });
})();
</script>
